name = "chaski-lector"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Modelo de Gemini que lee la explicación. gemini-3.5-flash-lite responde rápido. gemini-3.8-flash lee mejor pero piensa más y tarda más.
MODEL = "gemini-3.5-flash-lite"
# Páginas que pueden llamar al servidor, separadas por coma. "*" acepta cualquiera (solo para pruebas).
ALLOWED_ORIGINS = "*"

# La clave NO va aquí. Se guarda como secreto:
#   npx wrangler secret put GEMINI_API_KEY

# Dictado por voz (/transcribe): Whisper en Workers AI. No necesita clave; el plan gratis da 10 000 Neurons al día
# (unos 200 minutos de audio) para toda la cuenta.
[ai]
binding = "AI"
